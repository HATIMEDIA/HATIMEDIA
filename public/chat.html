<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATIMEDIA — Discuter</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; height: 100dvh; display: flex; overflow: hidden; }
        
        /* SIDEBAR (Menu de gauche) */
        .sidebar { width: 260px; background: #020617; border-right: 1px solid #1e293b; display: flex; flex-direction: column; transition: transform 0.3s; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #1e293b; }
        .sidebar-header h1 { font-size: 18px; color: #4ade80; margin-bottom: 15px; }
        .btn-new { width: 100%; padding: 10px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-new:hover { background: #334155; border-color: #4ade80; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { padding: 10px; font-size: 13px; color: #94a3b8; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .history-item:hover { background: #1e293b; color: #fff; }
        .history-item.active { background: #1e293b; color: #4ade80; border-left: 3px solid #4ade80; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #1e293b; font-size: 13px; }
        .sidebar-footer a { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .sidebar-footer a:hover { color: #4ade80; }

        /* MAIN CHAT (Zone de droite) */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .chat-header h2 { font-size: 16px; color: #fff; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
        .msg.assistant { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        
        .input-area { padding: 20px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
        .input-area input:focus { border-color: #4ade80; }
        .input-area button { background: #4ade80; color: #0f172a; border: none; padding: 0 20px; border-radius: 12px; cursor: pointer; font-size: 20px; }
        
        .thinking { display: flex; gap: 5px; align-items: center; font-style: italic; color: #94a3b8; font-size: 13px; margin-top: 10px; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; z-index: 10; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>🤖 HATIMEDIA</h1>
            <button class="btn-new" onclick="nouvelleConversation()">+ Nouveau chat</button>
        </div>
        <div class="history-list" id="historyList">
            <!-- L'historique s'affichera ici -->
        </div>
        <div class="sidebar-footer">
            <a href="/hub">🔄 Retour au Hub</a>
            <a href="/annuaire">🩺 Annuaire</a>
            <a href="/mes-rdvs">📅 Mes RDVs</a>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="main-chat">
        <div class="chat-header">
            <h2 id="currentAgentTitle">Assistant</h2>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="msg assistant">Bonjour ! Je suis votre assistant HATIMEDIA. Comment puis-je vous aider ?</div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Posez votre question..." onkeypress="if(event.key==='Enter') envoyerMessage()">
            <button onclick="envoyerMessage()">➤</button>
        </div>
    </div>

    <script>
        // GESTION DE L'AGENT
        const urlParams = new URLSearchParams(window.location.search);
        const agentActif = urlParams.get('agent') || 'general';
        const titres = {
            'medical': '🩺 Assistant Médical',
            'support': '🎧 Support Client',
            'code': '💻 Expert Code',
            'general': '💬 Assistant Général'
        };
        document.getElementById('currentAgentTitle').innerText = titres[agentActif] || 'Assistant';

        // SESSION
        let sessionId = localStorage.getItem("hatimedia_session");
        if (!sessionId) {
            sessionId = "sess_" + Math.random().toString(36).substring(2);
            localStorage.setItem("hatimedia_session", sessionId);
        }
        let conversationId = null;
        let enCours = false;

        // CHARGER L'HISTORIQUE (Sidebar)
        async function chargerHistorique() {
            try {
                const res = await fetch(`/api/chat-public/conversations/${sessionId}`);
                const data = await res.json();
                const list = document.getElementById('historyList');
                list.innerHTML = '';

                if (data.ok && data.conversations.length > 0) {
                    data.conversations.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        if (conversationId === c.id) div.classList.add('active');
                        div.innerText = c.title || "Nouvelle discussion";
                        div.onclick = () => chargerConversation(c.id);
                        list.appendChild(div);
                    });
                }
            } catch (e) { console.error(e); }
        }

        // CHARGER UNE CONVERSATION EXISTANTE
        async function chargerConversation(id) {
            conversationId = id;
            document.getElementById('chatBox').innerHTML = '';
            const res = await fetch(`/api/chat-public/historique/${sessionId}`);
            const data = await res.json();
            
            if (data.ok && data.conversationId === id && data.messages) {
                data.messages.forEach(m => ajouterMessage(m.content, m.role));
            }
            chargerHistorique(); // Rafraîchir la sidebar
        }

        // AJOUTER UN MESSAGE
        function ajouterMessage(texte, role) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = texte;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ENVOYER UN MESSAGE
        async function envoyerMessage() {
            const input = document.getElementById('messageInput');
            const texte = input.value.trim();
            if (!texte || enCours) return;

            enCours = true;
            input.value = '';
            ajouterMessage(texte, 'user');

            // Indicateur de frappe
            const chatBox = document.getElementById('chatBox');
            const thinking = document.createElement('div');
            thinking.className = 'msg assistant thinking';
            thinking.innerHTML = 'HATIMEDIA réfléchit...';
            chatBox.appendChild(thinking);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat-public', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: texte,
                        sessionId: sessionId,
                        conversationId: conversationId,
                        agent: agentActif // <-- L'AGENT EST ENVOYÉ ICI
                    })
                });
                const data = await res.json();
                
                thinking.remove();
                if (data.ok) {
                    ajouterMessage(data.reply, 'assistant');
                    if (data.conversationId) conversationId = data.conversationId;
                    chargerHistorique(); // Met à jour la sidebar avec le nouveau titre
                } else {
                    ajouterMessage("Erreur: " + data.error, 'assistant');
                }
            } catch (e) {
                thinking.remove();
                ajouterMessage("Erreur de connexion.", 'assistant');
            }
            enCours = false;
        }

        // NOUVELLE CONVERSATION
        function nouvelleConversation() {
            conversationId = null;
            document.getElementById('chatBox').innerHTML = '<div class="msg assistant">Nouvelle discussion. Comment puis-je vous aider ?</div>';
            chargerHistorique();
        }

        // INITIALISATION
        chargerHistorique();
    </script>
</body>
</html>
