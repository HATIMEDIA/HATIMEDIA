<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATIMEDIA — Discuter</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f7; height: 100dvh; display: flex; flex-direction: column; }
        .app { display: flex; flex-direction: column; height: 100dvh; max-width: 700px; margin: 0 auto; background: #fff; box-shadow: 0 0 40px rgba(0,0,0,.1); }
        .header { padding: 15px; background: #0f172a; color: #fff; text-align: center; font-weight: bold; font-size: 18px; }
        .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
        .assistant { align-self: flex-start; background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; }
        .input-area { padding: 15px; background: #fff; display: flex; gap: 10px; border-top: 1px solid #e2e8f0; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 24px; outline: none; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 10px 15px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">HATIMEDIA 🩺</div>
        <div id="chat" class="chat">
            <div class="message assistant">Bonjour ! Je suis HATIMEDIA. Comment puis-je vous aider ?</div>
        </div>
        <div class="input-area">
            <input id="msg" type="text" placeholder="Votre message..." onkeypress="if(event.key==='Enter') envoyer()">
            <button class="btn" onclick="envoyer()">➤</button>
        </div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const sessionId = "sess_" + Math.random().toString(36).substring(2);

        async function envoyer() {
            const input = document.getElementById('msg');
            const texte = input.value.trim();
            if (!texte) return;
            
            chat.innerHTML += `<div class="message user">${texte}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            try {
                const r = await fetch('/api/chat-public', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texte, sessionId })
                });
                const data = await r.json();
                chat.innerHTML += `<div class="message assistant">${data.reply}</div>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (e) {
                chat.innerHTML += `<div class="message assistant">Erreur de connexion.</div>`;
            }
        }
    </script>
</body>
</html>
