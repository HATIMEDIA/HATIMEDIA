<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATIMEDIA — Discuter</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; height: 100dvh; display: flex; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; background: #020617; border-right: 1px solid #1e293b; display: flex; flex-direction: column; transition: transform 0.3s; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #1e293b; }
        .sidebar-header h1 { font-size: 18px; color: #4ade80; margin-bottom: 15px; }
        .btn-new { width: 100%; padding: 10px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-new:hover { background: #334155; border-color: #4ade80; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { padding: 10px; font-size: 13px; color: #94a3b8; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .history-item:hover { background: #1e293b; color: #fff; }
        .history-item.active { background: #1e293b; color: #4ade80; border-left: 3px solid #4ade80; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #1e293b; font-size: 13px; }
        .sidebar-footer a { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .sidebar-footer a:hover { color: #4ade80; }

        /* MAIN CHAT */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .chat-header h2 { font-size: 16px; color: #fff; }
        .btn-voice { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 15px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; }
        .btn-voice:hover { border-color: #4ade80; }
        .btn-voice.active { background: #4ade80; color: #0f172a; border-color: #4ade80; }

        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
        .msg.assistant { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        
        .input-area { padding: 20px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: center; }
        .input-area input[type="text"] { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
        .input-area input[type="text"]:focus { border-color: #4ade80; }
        
        .btn-icon { background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8; padding: 0 5px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { color: #fff; transform: scale(1.1); }
        .btn-icon.actif { color: #ef4444; animation: pulse 1s infinite; }
        
        .btn-send { background: #4ade80; color: #0f172a; border: none; padding: 0 20px; height: 50px; border-radius: 12px; cursor: pointer; font-size: 20px; font-weight: bold; transition: 0.2s; }
        .btn-send:hover { background: #22c55e; }
        .btn-send:disabled { background: #64748b; cursor: not-allowed; }

        .thinking { display: flex; gap: 5px; align-items: center; font-style: italic; color: #94a3b8; font-size: 13px; margin-top: 10px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>🤖 HATIMEDIA</h1>
            <button class="btn-new" onclick="nouvelleConversation()">+ Nouveau chat</button>
        </div>
        <div class="history-list" id="historyList"></div>
        <div class="sidebar-footer">
            <a href="/hub">🔄 Retour au Hub</a>
            <a href="/annuaire">🩺 Annuaire</a>
            <a href="/mes-rdvs">📅 Mes RDVs</a>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="main-chat">
        <div class="chat-header">
            <h2 id="currentAgentTitle">Assistant</h2>
            <button class="btn-voice active" id="btnVoix" onclick="toggleVoix()">🔊 Audio ON</button>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="msg assistant">Bonjour ! Je suis votre assistant HATIMEDIA. Comment puis-je vous aider ?</div>
        </div>

        <div class="input-area">
            <!-- BOUTON MICRO -->
            <button class="btn-icon" id="btnParler" onclick="toggleParler()" title="Parler">🎙️</button>
            
            <input type="text" id="messageInput" placeholder="Posez votre question..." onkeypress="if(event.key==='Enter') envoyerMessage()">
            
            <!-- BOUTON TROMBONE -->
            <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="analyserImage(this)">
            <button class="btn-icon" onclick="document.getElementById('imageUpload').click()" title="Envoyer une image">📎</button>
            
            <button class="btn-send" id="sendBtn" onclick="envoyerMessage()">➤</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const agentActif = urlParams.get('agent') || 'general';
        const titres = { 'medical': '🩺 Assistant Médical', 'support': '🎧 Support Client', 'code': '💻 Expert Code', 'general': '💬 Assistant Général' };
        document.getElementById('currentAgentTitle').innerText = titres[agentActif] || 'Assistant';

        let sessionId = localStorage.getItem("hatimedia_session");
        if (!sessionId) { sessionId = "sess_" + Math.random().toString(36).substring(2); localStorage.setItem("hatimedia_session", sessionId); }
        let conversationId = null, enCours = false;
        
        // GESTION DE LA VOIX
        let voixActive = true;
        let modeVocal = false;
        let recognitionActive = null;

        function toggleVoix() {
            voixActive = !voixActive;
            const btn = document.getElementById('btnVoix');
            if (voixActive) {
                btn.innerHTML = "🔊 Audio ON";
                btn.classList.add('active');
            } else {
                btn.innerHTML = "🔇 Audio OFF";
                btn.classList.remove('active');
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            }
        }

        function faireParler(texte, callback) {
            if (!voixActive || !("speechSynthesis" in window)) { if (callback) callback(); return; }
            window.speechSynthesis.cancel();
            var voix = new SpeechSynthesisUtterance(texte);
            var voixDisponibles = window.speechSynthesis.getVoices();
            var voixFR = voixDisponibles.find(function (v) { return v.lang && v.lang.indexOf("fr") === 0; });
            if (voixFR) voix.voice = voixFR;
            voix.lang = "fr-FR"; voix.volume = 1; voix.rate = 1; voix.pitch = 1;
            voix.onend = function () { if (callback) callback(); };
            window.speechSynthesis.speak(voix);
        }

        function toggleParler() {
            modeVocal = !modeVocal;
            const btn = document.getElementById('btnParler');
            if (modeVocal) {
                btn.classList.add('actif');
                demarrerEcoute();
            } else {
                btn.classList.remove('actif');
                arreterEcoute();
            }
        }

        function arreterEcoute() {
            if (recognitionActive) { try { recognitionActive.abort(); } catch (e) {} recognitionActive = null; }
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            document.getElementById('messageInput').placeholder = "Posez votre question...";
        }

        function demarrerEcoute() {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("🎙️ La reconnaissance vocale n'est pas disponible dans ce navigateur.\nEssayez Chrome ou Safari.");
                modeVocal = false; document.getElementById('btnParler').classList.remove('actif');
                return;
            }
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            if (recognitionActive) { try { recognitionActive.abort(); } catch (e) {} recognitionActive = null; }
            
            setTimeout(function () {
                if (!modeVocal) return;
                var recognition = new SpeechRecognition();
                recognitionActive = recognition;
                recognition.lang = "fr-FR"; recognition.continuous = false; recognition.interimResults = false;
                recognition.onstart = function () { document.getElementById('messageInput').placeholder = "🎙️ Je vous écoute..."; };
                recognition.onresult = function (event) {
                    var texte = event.results[0][0].transcript;
                    document.getElementById('messageInput').value = texte;
                    document.getElementById('messageInput').placeholder = "Posez votre question...";
                    envoyerMessage();
                };
                recognition.onerror = function (event) {
                    recognitionActive = null;
                    if (event.error === "not-allowed") {
                        alert("🎙️ Autorisez l'accès au micro dans votre navigateur.");
                        modeVocal = false; document.getElementById('btnParler').classList.remove('actif');
                    }
                    if (event.error === "no-speech") { if (modeVocal) setTimeout(demarrerEcoute, 500); return; }
                    if (event.error === "aborted") return;
                    if (modeVocal) setTimeout(demarrerEcoute, 800);
                };
                recognition.onend = function () { recognitionActive = null; document.getElementById('messageInput').placeholder = "Posez votre question..."; };
                try { recognition.start(); } catch (e) {}
            }, 300);
        }

        async function chargerHistorique() {
            try {
                const res = await fetch(`/api/chat-public/conversations/${sessionId}`);
                const data = await res.json();
                const list = document.getElementById('historyList');
                list.innerHTML = '';
                if (data.ok && data.conversations.length > 0) {
                    data.conversations.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        if (conversationId === c.id) div.classList.add('active');
                        div.innerText = c.title || "Nouvelle discussion";
                        div.onclick = () => chargerConversation(c.id);
                        list.appendChild(div);
                    });
                }
            } catch (e) {}
        }

        async function chargerConversation(id) {
            conversationId = id;
            document.getElementById('chatBox').innerHTML = '';
            const res = await fetch(`/api/chat-public/historique/${sessionId}`);
            const data = await res.json();
            if (data.ok && data.messages) { data.messages.forEach(m => ajouterMessage(m.content, m.role)); }
            chargerHistorique();
        }

        function ajouterMessage(texte, role) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = texte;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function envoyerMessage() {
            const input = document.getElementById('messageInput');
            const texte = input.value.trim();
            if (!texte || enCours) return;
            enCours = true; input.value = '';
            ajouterMessage(texte, 'user');

            const chatBox = document.getElementById('chatBox');
            const thinking = document.createElement('div');
            thinking.className = 'msg assistant thinking';
            thinking.innerText = 'HATIMEDIA réfléchit...';
            chatBox.appendChild(thinking); chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat-public', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texte, sessionId: sessionId, conversationId: conversationId, agent: agentActif })
                });
                const data = await res.json();
                thinking.remove();
                
                if (data.ok) {
                    ajouterMessage(data.reply, 'assistant');
                    
                    if (data.carte) {
                        const mapDiv = document.createElement('div');
                        mapDiv.id = 'map-' + Date.now();
                        mapDiv.style.height = '250px'; mapDiv.style.width = '100%'; mapDiv.style.marginTop = '10px'; mapDiv.style.borderRadius = '12px';
                        chatBox.appendChild(mapDiv);
                        var map = L.map(mapDiv.id).setView([46.603354, 1.888334], 6);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                        if(data.carte === 'paris') map.setView([48.8566, 2.3522], 12);
                    }
                    
                    if (data.conversationId) conversationId = data.conversationId;
                    chargerHistorique();
                    
                    // L'IA PARLE
                    faireParler(data.reply, function () { if (modeVocal) setTimeout(demarrerEcoute, 300); });
                    
                } else { 
                    ajouterMessage("Erreur: " + data.error, 'assistant'); 
                    if (modeVocal) setTimeout(demarrerEcoute, 500);
                }
            } catch (e) { 
                thinking.remove(); 
                ajouterMessage("Erreur de connexion.", 'assistant'); 
                if (modeVocal) setTimeout(demarrerEcoute, 1000);
            }
            enCours = false;
        }

        async function analyserImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64 = e.target.result;
                    ajouterMessage("📷 Analyse de l'image en cours...", 'user');
                    try {
                        const res = await fetch('/api/chat-vision', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image: base64, message: "Analyse cette ordonnance." })
                        });
                        const data = await res.json();
                        ajouterMessage(data.reply, 'assistant');
                        faireParler(data.reply);
                    } catch (e) { ajouterMessage("Erreur vision.", 'assistant'); }
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function nouvelleConversation() {
            conversationId = null;
            document.getElementById('chatBox').innerHTML = '<div class="msg assistant">Nouvelle discussion. Comment puis-je vous aider ?</div>';
            chargerHistorique();
        }

        chargerHistorique();
    </script>
</body>
</html>
