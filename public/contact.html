<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATIMEDIA - Contact</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #050810; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #111827; padding: 40px; border-radius: 20px; max-width: 500px; width: 100%; border: 1px solid #1f2937; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { font-size: 24px; color: #4ade80; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #4ade80; }
        button { width: 100%; padding: 14px; background: #4ade80; color: #0a0e1a; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #22c55e; }
        .back { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 13px; }
        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📧 Contactez-nous</h1>
        <p>Une question, un projet ? Remplissez ce formulaire et nous vous répondrons sous 24h.</p>
        <form id="contactForm" onsubmit="envoyer(event)">
            <input type="text" id="nom" placeholder="Votre nom" required>
            <input type="email" id="email" placeholder="Votre email" required>
            <textarea id="message" rows="5" placeholder="Votre message" required></textarea>
            <button type="submit">Envoyer le message</button>
        </form>
        <a href="/" class="back">← Retour à l'accueil</a>
    </div>

    <script>
        async function envoyer(e) {
            e.preventDefault();
            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, email, message })
                });
                const data = await res.json();
                if (data.ok) {
                    alert("✅ Message envoyé avec succès !");
                    document.getElementById('contactForm').reset();
                } else {
                    alert("❌ Erreur : " + data.error);
                }
                } catch (err) {
                alert("❌ Erreur : " + err.message);
            }
        }
    </script>
</body>
</html>
