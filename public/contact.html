<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — HATIMEDIA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; color: #e0e6ed; line-height: 1.6; min-height: 100dvh; }
  header { position: sticky; top: 0; z-index: 100; background: rgba(10, 14, 26, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #1f2937; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 22px; font-weight: bold; color: #4ade80; }
  .logo span { color: #38bdf8; }
  .nav-links { display: flex; gap: 25px; align-items: center; }
  .nav-links a { color: #94a3b8; text-decoration: none; font-size: 14px; }
  .nav-links a:hover { color: #4ade80; }
  .btn-nav { background: linear-gradient(90deg, #4ade80, #38bdf8); color: #0a0e1a; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 14px; }
  .container { max-width: 600px; margin: 0 auto; padding: 60px 30px; }
  h1 { font-size: 42px; margin-bottom: 15px; background: linear-gradient(90deg, #4ade80, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #94a3b8; font-size: 17px; margin-bottom: 40px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; color: #e0e6ed; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  input, textarea { width: 100%; padding: 14px 16px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; color: #e0e6ed; font-size: 15px; font-family: inherit; }
  input:focus, textarea:focus { outline: none; border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15); }
  textarea { min-height: 140px; resize: vertical; }
  .btn-submit { width: 100%; padding: 16px; background: linear-gradient(90deg, #4ade80, #38bdf8); color: #0a0e1a; border: 0; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: transform 0.15s, box-shadow 0.15s; }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(74, 222, 128, 0.4); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .message-status { margin-top: 20px; padding: 14px; border-radius: 12px; text-align: center; font-size: 15px; display: none; }
  .message-status.success { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid #4ade80; display: block; }
  .message-status.error { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid #f87171; display: block; }
  footer { padding: 40px 30px; text-align: center; border-top: 1px solid #1f2937; color: #64748b; font-size: 14px; }
  footer a { color: #4ade80; text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="logo">🤖 HATIMEDIA<span>.ai</span></div>
  <nav class="nav-links">
    <a href="/">Accueil</a>
    <a href="/chat" class="btn-nav">Essayer</a>
  </nav>
</header>

<div class="container">
  <h1>Parlons de votre projet</h1>
  <p class="subtitle">Une question ? Un projet ? Écrivez-nous, on répond en moins de 24h.</p>

  <form id="contactForm" onsubmit="envoyerContact(event)">
    <div class="form-group">
      <label for="nom">Votre nom</label>
      <input type="text" id="nom" name="nom" required placeholder="Ex: Jean Dupont">
    </div>
    <div class="form-group">
      <label for="email">Votre email</label>
      <input type="email" id="email" name="email" required placeholder="vous@exemple.com">
    </div>
    <div class="form-group">
      <label for="message">Votre message</label>
      <textarea id="message" name="message" required placeholder="Dites-nous ce que vous cherchez..."></textarea>
    </div>
    <button type="submit" class="btn-submit" id="btnSubmit">📧 Envoyer le message</button>
    <div id="messageStatus" class="message-status"></div>
  </form>
</div>

<footer>
  <p>© 2026 HATIMEDIA — <a href="/">Accueil</a> · <a href="/chat">Essayer</a></p>
</footer>

<script>
async function envoyerContact(event) {
  event.preventDefault();

  var nom = document.getElementById("nom").value.trim();
  var email = document.getElementById("email").value.trim();
  var message = document.getElementById("message").value.trim();
  var btn = document.getElementById("btnSubmit");
  var status = document.getElementById("messageStatus");

  btn.disabled = true;
  btn.textContent = "⏳ Envoi en cours...";
  status.className = "message-status";

  try {
    var r = await fetch("/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nom: nom, email: email, message: message })
    });

    var data = await r.json();

    if (data.ok) {
      status.className = "message-status success";
      status.textContent = "✅ Message envoyé ! On vous répond dans moins de 24h.";
      document.getElementById("contactForm").reset();
    } else {
      throw new Error(data.error || "Erreur inconnue");
    }
  } catch (error) {
    console.error(error);
    status.className = "message-status error";
    status.textContent = "❌ Erreur : " + error.message;
  }

  btn.disabled = false;
  btn.textContent = "📧 Envoyer le message";
}
</script>

</body>
</html>
