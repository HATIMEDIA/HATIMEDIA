<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATIMEDIA — Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #0a0e1a;
            color: #1f2937;
            min-height: 100vh;
            overflow: hidden;
        }

        /* LOGIN */
        #loginPanel {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0e1a 0%, #111827 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #loginPanel > div {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            background: #111827;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
        }
        #loginPanel .logo-login { text-align: center; font-size: 55px; margin-bottom: 15px; }
        #loginPanel h2 { text-align: center; margin: 0 0 25px; color: #e0e6ed; font-size: 22px; }
        #loginPanel input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #0a0e1a;
            color: #e0e6ed;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #loginPanel input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
        }
        #loginButton {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(90deg, #4ade80, #38bdf8);
            color: #0a0e1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #loginButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(74, 222, 128, 0.4);
        }
        #loginButton:disabled { opacity: 0.6; cursor: wait; }
        #loginError { margin-top: 12px; color: #f87171; text-align: center; min-height: 20px; font-size: 13px; }

        /* LAYOUT */
        .app {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            background: #f8f9fc;
        }

        /* SIDEBAR */
        .sidebar {
            background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            gap: 12px;
            border-right: 1px solid #1e293b;
            overflow: hidden;
            min-height: 0;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }
        .sidebar-logo span { color: #38bdf8; }

        .new-conv {
            background: linear-gradient(135deg, #4ade80, #38bdf8);
            color: #0a0e1a;
            border: 0;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.25);
        }
        .new-conv:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 222, 128, 0.4);
        }

        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-top: 12px;
            padding-left: 8px;
            font-weight: 600;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .conversations-list::-webkit-scrollbar { width: 5px; }
        .conversations-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .conv-empty {
            font-size: 12px;
            color: #64748b;
            padding: 20px 12px;
            text-align: center;
            font-style: italic;
        }

        .conv-item {
            position: relative;
            padding: 12px 32px 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.3;
            overflow: hidden;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .conv-item:hover {
            background: rgba(255,255,255,.06);
            color: #fff;
            border-left-color: #38bdf8;
        }
        .conv-item.active {
            background: rgba(74, 222, 128, 0.12);
            color: #fff;
            border-left-color: #4ade80;
        }
        .conv-title {
            display: block;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-preview {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }
        .conv-delete {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            border-radius: 6px;
            padding: 5px 7px;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s, background 0.15s;
            font-size: 14px;
        }
        .conv-item:hover .conv-delete { opacity: 1; }
        .conv-delete:hover { color: #f87171; background: rgba(248, 113, 113, .15); }

        /* MAIN */
        .main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .header {
            padding: 20px 30px;
            background: linear-gradient(135deg, #111827, #263a63);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .header span { display: block; margin-top: 4px; color: rgba(255,255,255,.65); font-size: 13px; }
        .header-right { display: flex; gap: 10px; align-items: center; }
        .clear {
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.08);
            color: #fff;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .clear:hover { background: rgba(255,255,255,.18); }

        /* CHAT */
        .chat {
            flex: 1;
            background: #f8f9fc;
            padding: 25px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 15px;
            animation: msgIn 0.25s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border-bottom-right-radius: 5px;
        }
        .assistant {
            align-self: flex-start;
            background: #fff;
            color: #1f2937;
            border-bottom-left-radius: 5px;
            border: 1px solid #e2e7f0;
        }

        /* WELCOME */
        .welcome {
            position: relative;
            text-align: center;
            margin: auto;
            padding: 45px 30px 40px;
            border-radius: 28px;
            background:
                radial-gradient(circle at 15% 20%, rgba(74, 222, 128, 0.15), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.15), transparent 40%),
                linear-gradient(135deg, #ffffff, #f0f4ff);
            box-shadow: 0 20px 60px rgba(80, 60, 130, 0.12);
            max-width: 850px;
        }
        .welcome-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #4ade80, #38bdf8);
            font-size: 38px;
            box-shadow: 0 12px 30px rgba(74, 222, 128, 0.3);
        }
        .welcome h2 { margin: 0 0 8px; color: #111827; font-size: 26px; font-weight: 800; }
        .welcome p { margin: 0 0 28px; color: #6b7280; font-size: 15px; }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            max-width: 100%;
        }
        .action-card {
            padding: 20px 12px;
            border: 1px solid #e2e7f0;
            border-radius: 18px;
            background: rgba(255,255,255,0.9);
            cursor: pointer;
            transition: all 0.2s;
            color: #172033;
            text-align: center;
        }
        .action-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(80, 55, 140, 0.15);
            border-color: #4ade80;
        }
        .action-icon { display: block; font-size: 28px; margin-bottom: 10px; }
        .action-card strong { display: block; color: #18233a; font-size: 13px; font-weight: 700; }
        .action-card small { display: block; margin-top: 5px; color: #7a8495; line-height: 1.4; font-size: 11px; }

        /* INPUT */
        .input-area {
            padding: 18px 30px;
            background: #fff;
            border-top: 1px solid #e7ebf2;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        #message {
            flex: 1;
            min-width: 0;
            border: 2px solid #e2e7f0;
            border-radius: 14px;
            background: #f8f9fc;
            color: #172033;
            padding: 14px 18px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #message:focus {
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .send {
            border: 0;
            border-radius: 14px;
            padding: 0 26px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .send:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
        }

        /* MODALE CRÉER */
        .hatimedia-create-box {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .hatimedia-create-panel {
            width: min(560px, 100%);
            padding: 28px;
            border-radius: 20px;
            background: #111827;
            color: white;
            box-shadow: 0 30px 80px rgba(0,0,0,.6);
            border: 1px solid #1f2937;
        }
        .hatimedia-create-panel h3 { margin: 0 0 6px; font-size: 20px; }
        .hatimedia-create-panel p { margin: 0 0 20px; opacity: .7; font-size: 14px; }
        .hatimedia-create-types {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .hatimedia-create-types button {
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            background: #1e293b;
            color: white;
            transition: all 0.15s;
            font-size: 13px;
        }
        .hatimedia-create-types button:hover {
            background: #334155;
            border-color: #4ade80;
        }
        #hatimediaCreatePrompt {
            width: 100%;
            min-height: 110px;
            box-sizing: border-box;
            resize: vertical;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0a0e1a;
            color: white;
            padding: 14px;
            font: inherit;
            outline: none;
        }
        #hatimediaCreatePrompt:focus { border-color: #4ade80; }
        .hatimedia-create-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .hatimedia-create-actions button {
            border: 0;
            border-radius: 12px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
        }
        .hatimedia-create-actions .annuler {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
        }
        .hatimedia-create-actions .generer {
            background: linear-gradient(90deg, #4ade80, #38bdf8);
            color: #0a0e1a;
        }

        @media (max-width: 800px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .action-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPanel">
    <div>
        <div class="logo-login">🤖</div>
        <h2>Connexion HATIMEDIA</h2>

        <input id="loginEmail" type="email" placeholder="Votre email" autocomplete="email">
        <input id="loginPassword" type="password" placeholder="Votre mot de passe" autocomplete="current-password">

        <button id="loginButton" onclick="connexion()">Se connecter</button>

        <div id="loginError"></div>
    </div>
</div>

<!-- APP -->
<div class="app">

    <aside class="sidebar">
        <div class="sidebar-logo">🤖 HATIMEDIA<span>.ai</span></div>
        <button class="new-conv" onclick="nouvelleConversation()">➕ Nouvelle conversation</button>
        <div class="sidebar-title">Historique</div>
        <div id="conversationsList" class="conversations-list">
            <div class="conv-empty">Aucune conversation.</div>
        </div>
    </aside>

    <main class="main">

        <div class="header">
            <div>
                <h1>🤖 HATIMEDIA Admin</h1>
                <span>Propulsé par OpenAI · Mode administrateur</span>
            </div>
            <div class="header-right">
                <button class="clear" onclick="chargerHistorique()">🔄 Rafraîchir</button>
                <button class="clear" onclick="deconnexion()">🚪 Déconnexion</button>
            </div>
        </div>

        <div id="chat" class="chat">
            <div id="welcome" class="welcome">
                <div class="welcome-logo">🏰</div>
                <h2>Bienvenue sur HATIMEDIA Admin 👋🏾</h2>
                <p>Votre espace de travail IA personnel.</p>

                <div class="action-grid">
                    <button class="action-card" onclick="document.getElementById('message').focus()">
                        <span class="action-icon">💬</span>
                        <strong>DISCUTER</strong>
                        <small>Parler avec HATIMEDIA</small>
                    </button>
                    <button class="action-card" onclick="parler()">
                        <span class="action-icon">🎙️</span>
                        <strong>PARLER</strong>
                        <small>Voix</small>
                    </button>
                    <button class="action-card" onclick="analyser()">
                        <span class="action-icon">📄</span>
                        <strong>ANALYSER</strong>
                        <small>Documents</small>
                    </button>
                    <button class="action-card" onclick="creer()">
                        <span class="action-icon">💡</span>
                        <strong>CRÉER</strong>
                        <small>Idées</small>
                    </button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <input id="message" type="text" placeholder="Écrivez votre message..." autocomplete="off">
            <button class="send" onclick="envoyerMessage()">Envoyer</button>
        </div>

    </main>
</div>

<script>
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const conversationsList = document.getElementById("conversationsList");

let conversation = [];
let conversationCouranteId = null;

function htmlAccueil() {
    return `
        <div id="welcome" class="welcome">
            <div class="welcome-logo">🏰</div>
            <h2>Bienvenue sur HATIMEDIA Admin 👋🏾</h2>
            <p>Votre espace de travail IA personnel.</p>
            <div class="action-grid">
                <button class="action-card" onclick="document.getElementById('message').focus()">
                    <span class="action-icon">💬</span><strong>DISCUTER</strong><small>Parler avec HATIMEDIA</small>
                </button>
                <button class="action-card" onclick="parler()">
                    <span class="action-icon">🎙️</span><strong>PARLER</strong><small>Voix</small>
                </button>
                <button class="action-card" onclick="analyser()">
                    <span class="action-icon">📄</span><strong>ANALYSER</strong><small>Documents</small>
                </button>
                <button class="action-card" onclick="creer()">
                    <span class="action-icon">💡</span><strong>CRÉER</strong><small>Idées</small>
                </button>
            </div>
        </div>`;
}

function afficherAccueil() {
    chat.innerHTML = htmlAccueil();
}

function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* CONNEXION */
async function connexion() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const erreur = document.getElementById("loginError");
    const bouton = document.getElementById("loginButton");

    erreur.textContent = "";
    if (!email || !password) { erreur.textContent = "Email et mot de passe obligatoires."; return; }

    bouton.disabled = true;
    bouton.textContent = "Connexion...";

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (!response.ok || !data.token) throw new Error(data.error || "Connexion impossible");

        localStorage.setItem("hatimedia_token", data.token);
        document.getElementById("loginPanel").style.display = "none";

        conversationCouranteId = null;
        conversation = [];
        afficherAccueil();
        await chargerHistorique();
        input.focus();
    } catch (error) {
        console.error(error);
        erreur.textContent = error.message || "Erreur de connexion.";
    } finally {
        bouton.disabled = false;
        bouton.textContent = "Se connecter";
    }
}

function deconnexion() {
    if (!confirm("Se déconnecter ?")) return;
    localStorage.removeItem("hatimedia_token");
    location.reload();
}

/* HISTORIQUE */
async function chargerHistorique() {
    const token = localStorage.getItem("hatimedia_token");
    if (!token) return;
    try {
        const response = await fetch("/api/conversations", {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();
        if (!response.ok || !data.ok) return;
        afficherConversations(data.conversations);
    } catch (error) {
        console.error("ERREUR HISTORIQUE :", error);
    }
}

function afficherConversations(conversations) {
    conversationsList.innerHTML = "";
    if (!conversations || conversations.length === 0) {
        conversationsList.innerHTML = `<div class="conv-empty">Aucune conversation.</div>`;
        return;
    }
    for (const conv of conversations) {
        const item = document.createElement("div");
        item.className = "conv-item";
        item.dataset.convId = conv.id;
        if (String(conv.id) === String(conversationCouranteId)) item.classList.add("active");

        const titre = conv.title || "Sans titre";
        const apercu = conv.last_message ? conv.last_message.replace(/\s+/g, " ").slice(0, 60) : "Conversation vide";

        item.innerHTML = `
            <span class="conv-title">${escapeHtml(titre)}</span>
            <span class="conv-preview">${escapeHtml(apercu)}</span>
            <button class="conv-delete" title="Supprimer">🗑️</button>
        `;

        item.addEventListener("click", (e) => {
            if (e.target.classList.contains("conv-delete")) return;
            ouvrirConversation(conv.id);
        });
        item.querySelector(".conv-delete").addEventListener("click", async (e) => {
            e.stopPropagation();
            await supprimerConversation(conv.id);
        });
        conversationsList.appendChild(item);
    }
}

/* OUVRIR */
async function ouvrirConversation(conversationId) {
    const token = localStorage.getItem("hatimedia_token");
    if (!token) return;
    try {
        const response = await fetch(`/api/conversations/${conversationId}/messages`, {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error("Erreur de chargement");

        conversationCouranteId = conversationId;
        conversation = data.messages.map(m => ({ role: m.role, content: m.content }));
        chat.innerHTML = "";

        if (data.messages.length === 0) {
            afficherAccueil();
        } else {
            for (const m of data.messages) {
                ajouterMessage(m.content, m.role === "user" ? "user" : "assistant", false);
            }
            chat.scrollTop = chat.scrollHeight;
        }

        document.querySelectorAll(".conv-item").forEach(el => {
            if (String(el.dataset.convId) === String(conversationId)) el.classList.add("active");
            else el.classList.remove("active");
        });

        input.focus();
    } catch (error) {
        console.error(error);
        ajouterMessage("❌ Impossible de charger cette conversation.", "assistant");
    }
}

/* NOUVELLE */
async function nouvelleConversation() {
    const token = localStorage.getItem("hatimedia_token");
    if (!token) return;
    try {
        const response = await fetch("/api/conversations", {
            method: "POST",
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error("Erreur de création");

        conversationCouranteId = data.conversation.id;
        conversation = [];
        afficherAccueil();
        await chargerHistorique();
        input.focus();
    } catch (error) {
        console.error(error);
    }
}

/* SUPPRIMER */
async function supprimerConversation(conversationId) {
    if (!confirm("Supprimer cette conversation ?")) return;
    const token = localStorage.getItem("hatimedia_token");
    try {
        const response = await fetch(`/api/conversations/${conversationId}`, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error("Erreur suppression");

        if (String(conversationId) === String(conversationCouranteId)) {
            conversationCouranteId = null;
            conversation = [];
            afficherAccueil();
        }
        await chargerHistorique();
    } catch (error) {
        console.error(error);
        alert("Suppression impossible.");
    }
}

/* AJOUTER MESSAGE */
function ajouterMessage(texte, type, scroll = true) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = texte;
    chat.appendChild(message);

    if (scroll) chat.scrollTop = chat.scrollHeight;
    return message;
}

/* ENVOYER */
async function envoyerMessage() {
    const message = input.value.trim();
    if (!message) return;

    ajouterMessage(message, "user");
    conversation.push({ role: "user", content: message });
    input.value = "";

    const thinking = ajouterMessage("⏳ L'IA réfléchit...", "assistant");

    try {
        const token = localStorage.getItem("hatimedia_token");
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ message: message, conversationId: conversationCouranteId })
        });
        const data = await response.json();
        thinking.remove();

        if (data.reply) {
            ajouterMessage(data.reply, "assistant");
            conversation.push({ role: "assistant", content: data.reply });

            if ("speechSynthesis" in window && typeof data.reply === "string") {
                const voix = new SpeechSynthesisUtterance(data.reply);
                const voixThomas = window.speechSynthesis.getVoices().find(v => v.name === "Thomas");
                if (voixThomas) voix.voice = voixThomas;
                voix.lang = "fr-FR";
                window.speechSynthesis.speak(voix);
            }

            if (data.conversationId) conversationCouranteId = data.conversationId;
            await chargerHistorique();
        } else {
            ajouterMessage("Une erreur est survenue.", "assistant");
        }
    } catch (error) {
        console.error(error);
        thinking.remove();
        ajouterMessage("Impossible de contacter le serveur.", "assistant");
    }
    input.focus();
}

/* ENTREE */
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        envoyerMessage();
    }
});

/* DEMARRAGE */
window.addEventListener("load", async () => {
    const token = localStorage.getItem("hatimedia_token");
    if (!token) return;
    document.getElementById("loginPanel").style.display = "none";
    afficherAccueil();
    await chargerHistorique();
});
</script>

<script>
function parler() {
    if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
        alert("La reconnaissance vocale n'est pas disponible dans ce navigateur.");
        return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = "fr-FR";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = function (event) {
        input.value = event.results[0][0].transcript;
        envoyerMessage();
    };
    recognition.onerror = function (event) {
        alert("Impossible d'utiliser le microphone : " + event.error);
    };
    recognition.start();
}

function analyser() {
    const choixFichier = document.createElement("input");
    choixFichier.type = "file";
    choixFichier.accept = ".pdf,.docx,.txt";
    choixFichier.onchange = async function () {
        if (!choixFichier.files.length) return;
        const fichier = choixFichier.files[0];
        const formulaire = new FormData();
        formulaire.append("document", fichier);
        try {
            const response = await fetch("/api/analyser-document", {
                method: "POST",
                headers: { "Authorization": "Bearer " + localStorage.getItem("hatimedia_token") },
                body: formulaire
            });
            const data = await response.json();
            if (!response.ok || !data.ok) throw new Error(data.error || "Erreur");
            ajouterMessage(
                "📄 Document analysé ✅\n\nFichier : " + data.filename + "\n\n" + (data.text || ""),
                "assistant"
            );
        } catch (error) {
            ajouterMessage("❌ Impossible d'envoyer le document.", "assistant");
        }
    };
    choixFichier.click();
}

function creer() {
    if (document.querySelector(".hatimedia-create-box")) return;
    const box = document.createElement("div");
    box.className = "hatimedia-create-box";
    box.innerHTML = `
        <div class="hatimedia-create-panel">
            <h3>💡 Créer avec HATIMEDIA</h3>
            <p>Choisissez un type puis décrivez ce que vous voulez créer.</p>
            <div class="hatimedia-create-types">
                <button onclick="choisirCreation('un texte')">✍🏾 Texte</button>
                <button onclick="choisirCreation('une idée')">💡 Idée</button>
                <button onclick="choisirCreation('une publication')">📱 Publication</button>
                <button onclick="choisirCreation('un email')">📧 Email</button>
            </div>
            <textarea id="hatimediaCreatePrompt" placeholder="Exemple : présente HATIMEDIA en quelques lignes..."></textarea>
            <div class="hatimedia-create-actions">
                <button class="annuler" onclick="fermerCreation()">Annuler</button>
                <button class="generer" onclick="genererCreation()">✨ Générer</button>
            </div>
        </div>
    `;
    document.body.appendChild(box);
    document.getElementById("hatimediaCreatePrompt").focus();
}

function choisirCreation(type) {
    const zone = document.getElementById("hatimediaCreatePrompt");
    if (zone) { zone.value = "Crée " + type + " : "; zone.focus(); }
}
function fermerCreation() {
    const box = document.querySelector(".hatimedia-create-box");
    if (box) box.remove();
}

async function genererCreation() {
    const zone = document.getElementById("hatimediaCreatePrompt");
    const prompt = zone ? zone.value.trim() : "";
    if (!prompt) { alert("Écrivez d'abord ce que vous voulez créer."); return; }

    const token = localStorage.getItem("hatimedia_token");
    if (!token) { alert("Session expirée."); return; }

    const bouton = document.querySelector(".hatimedia-create-actions .generer");
    if (bouton) { bouton.disabled = true; bouton.textContent = "⏳ Génération..."; }

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ message: prompt, conversationId: conversationCouranteId })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Erreur");

        fermerCreation();
        ajouterMessage("💡 Création HATIMEDIA\n\n" + (data.reply || "Terminé."), "assistant");

        if (data.conversationId) conversationCouranteId = data.conversationId;
        await chargerHistorique();
    } catch (error) {
        alert("Impossible de générer : " + error.message);
        if (bouton) { bouton.disabled = false; bouton.textContent = "✨ Générer"; }
    }
}
</script>

</body>
