<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATIMEDIA - Mes Rendez-vous</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f7f6; color: #333; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2563eb; font-size: 28px; }
        .container { max-width: 800px; margin: 0 auto; }
        .search-box { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .search-box button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .card { background: #fff; border-left: 4px solid #10b981; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h3 { font-size: 18px; color: #1e293b; margin-bottom: 5px; }
        .card p { font-size: 14px; color: #64748b; margin-bottom: 5px; }
        .btn-back { display: block; text-align: center; margin-top: 30px; color: #2563eb; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📅 Mes Rendez-vous</h1>
        <p>Retrouvez tous vos rendez-vous HATIMEDIA</p>
    </div>
    <div class="container">
        <div class="search-box">
            <input type="email" id="email" placeholder="Entrez votre adresse email...">
            <button onclick="chercherRdvs()">Voir mes RDVs</button>
        </div>
        <div id="results"></div>
        <a href="/annuaire" class="btn-back">← Retour à l'annuaire</a>
    </div>

    <script>
        async function chercherRdvs() {
            const email = document.getElementById('email').value;
            const resultsDiv = document.getElementById('results');
            
            if (!email) { alert("Entrez votre email."); return; }
            resultsDiv.innerHTML = '<p style="text-align:center;">Recherche...</p>';

            try {
                const res = await fetch(`/api/patient/rdvs?email=${encodeURIComponent(email)}`);
                const data = await res.json();
                resultsDiv.innerHTML = '';
                
                if (!data.ok || data.rdvs.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:#999;">Aucun rendez-vous trouvé pour cet email.</p>';
                    return;
                }

                data.rdvs.forEach(r => {
                    const date = new Date(r.appointment_date).toLocaleString("fr-FR");
                    resultsDiv.innerHTML += `
                        <div class="card">
                            <h3>Avec ${r.doctor_name}</h3>
                            <p><strong>Spécialité :</strong> ${r.doctor_specialty}</p>
                            <p><strong>Date :</strong> ${date}</p>
                            <p>📍 ${r.doctor_address}</p>
                            <button onclick="annulerRdv(${r.id})" style="margin-top: 10px; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Annuler ce RDV</button>
                        </div>
                    `;
                });
            } catch (e) {
                resultsDiv.innerHTML = '<p style="color:red; text-align:center;">Erreur de connexion.</p>';
            }
        }

        async function annulerRdv(id) {
            if (!confirm("Voulez-vous vraiment annuler ce rendez-vous ?")) return;
            try {
                const res = await fetch(`/api/rdv/annuler/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.ok) {
                    alert("✅ Rendez-vous annulé.");
                    chercherRdvs(); // Recharge la liste
                } else {
                    alert("Erreur: " + data.error);
                }
            } catch (e) { alert("Erreur de connexion."); }
        }
    </script>
</body>
</html>
