<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Chargement...</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --primary: #4ade80; --secondary: #38bdf8; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100dvh; background: linear-gradient(135deg, #f0f2f7 0%, #e0e5ee 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
.app { display: flex; flex-direction: column; width: 100%; max-width: 700px; height: 90vh; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
.header { padding: 20px 24px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.header .logo { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; overflow: hidden; }
.header .logo img { width: 100%; height: 100%; object-fit: cover; }
.header .info { flex: 1; }
.header h1 { font-size: 18px; font-weight: 700; color: #fff; margin: 0; }
.header p { font-size: 12px; color: rgba(255,255,255,0.85); margin-top: 2px; }
.chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; background: #f8f9fc; }
.welcome-msg { text-align: center; padding: 30px 20px; color: #4b5563; background: rgba(255,255,255,0.95); border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); margin: auto; }
.welcome-msg .emoji { font-size: 42px; margin-bottom: 12px; }
.welcome-msg p { font-size: 15px; line-height: 1.5; }
.message { max-width: 78%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 15px; animation: msgIn 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.user { align-self: flex-end; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-bottom-right-radius: 5px; }
.assistant { align-self: flex-start; background: #fff; color: #1f2937; border-bottom-left-radius: 5px; border: 1px solid #e2e7f0; }
.thinking { align-self: flex-start; background: #fff; border: 1px solid #e2e7f0; padding: 14px 18px; border-radius: 18px; border-bottom-left-radius: 5px; display: flex; gap: 5px; align-items: center; }
.thinking .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; animation: dotBounce 1.4s infinite ease-in-out; }
.thinking .dot:nth-child(1) { animation-delay: -0.32s; }
.thinking .dot:nth-child(2) { animation-delay: -0.16s; }
.thinking .dot:nth-child(3) { animation-delay: 0s; }
@keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
.input-area { padding: 14px 16px; background: #fff; border-top: 1px solid #e7ebf2; display: flex; gap: 10px; flex-shrink: 0; }
#message { flex: 1; min-width: 0; border: 2px solid #e2e7f0; border-radius: 22px; background: #f8f9fc; padding: 12px 18px; font-size: 15px; outline: none; font-family: inherit; transition: border-color 0.2s; }
#message:focus { border-color: var(--primary); background: #fff; }
.send { width: 48px; height: 48px; border: 0; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.15s; }
.send:hover { transform: scale(1.08); }
.send:disabled { opacity: 0.5; cursor: not-allowed; }
.footer { padding: 10px; text-align: center; font-size: 11px; color: #9ca3af; background: #fff; border-top: 1px solid #f1f5f9; }
.footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="logo" id="clientLogo">💬</div>
<div class="info">
<h1 id="clientName">Chargement...</h1>
<p>En ligne · Répond en 5 sec</p>
</div>
</div>
<div id="chat" class="chat">
<div class="welcome-msg" id="welcomeMsg">
<div class="emoji">💬</div>
<p>Chargement...</p>
</div>
</div>
<div class="input-area">
<input id="message" type="text" placeholder="Votre message..." autocomplete="off">
<button class="send" id="sendBtn" onclick="envoyerMessage()">➤</button>
</div>
<div class="footer">Propulsé par <a href="https://hatimedia.onrender.com" target="_blank">HATIMEDIA</a></div>
</div>
<script>
var pathParts = window.location.pathname.split("/");
var slug = pathParts[pathParts.length - 1];
var chat = document.getElementById("chat");
var input = document.getElementById("message");
var sendBtn = document.getElementById("sendBtn");
var sessionId = localStorage.getItem("hatimedia_client_session_" + slug);
if (!sessionId) {
sessionId = "sess_" + Math.random().toString(36).substring(2) + Date.now();
localStorage.setItem("hatimedia_client_session_" + slug, sessionId);
}
var conversationId = null;
var enCours = false;
var clientConfig = null;
async function chargerClient() {
try {
var r = await fetch("/api/client/" + slug);
var data = await r.json();
if (!data.ok) {
document.getElementById("welcomeMsg").innerHTML = '<div class="emoji">❌</div><p>Client introuvable.</p>';
return;
}
clientConfig = data.client;
document.documentElement.style.setProperty("--primary", clientConfig.primary_color || "#4ade80");
document.documentElement.style.setProperty("--secondary", clientConfig.secondary_color || "#38bdf8");
document.getElementById("clientName").textContent = clientConfig.name;
document.title = clientConfig.name + " — Chat";
if (clientConfig.logo_url) {
document.getElementById("clientLogo").innerHTML = '<img src="' + clientConfig.logo_url + '" alt="logo">';
}
if (clientConfig.welcome_message) {
document.getElementById("welcomeMsg").innerHTML = '<div class="emoji">💬</div><p>' + clientConfig.welcome_message + '</p>';
}
} catch (e) {
console.error("Erreur chargement client :", e);
}
}
function ajouterMessage(texte, type) {
var welcome = document.getElementById("welcomeMsg");
if (welcome) welcome.remove();
var div = document.createElement("div");
div.className = "message " + type;
div.textContent = texte;
chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
return div;
}
async function envoyerMessage() {
var texte = input.value.trim();
if (!texte || enCours || !clientConfig) return;
enCours = true;
sendBtn.disabled = true;
ajouterMessage(texte, "user");
input.value = "";
var thinking = document.createElement("div");
thinking.className = "thinking";
thinking.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
chat.appendChild(thinking);
chat.scrollTop = chat.scrollHeight;
try {
var r = await fetch("/api/chat-client", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
message: texte,
sessionId: sessionId,
conversationId: conversationId,
slug: slug
})
});
var data = await r.json();
thinking.remove();
if (data.reply) {
ajouterMessage(data.reply, "assistant");
if (data.conversationId) conversationId = data.conversationId;
} else {
ajouterMessage("Hmm, je n'ai pas pu répondre. Réessayez !", "assistant");
}
} catch (error) {
console.error(error);
thinking.remove();
ajouterMessage("Connexion perdue. Vérifiez votre réseau.", "assistant");
}
enCours = false;
sendBtn.disabled = false;
input.focus();
}
input.addEventListener("keydown", function (e) {
if (e.key === "Enter") { e.preventDefault(); envoyerMessage(); }
});
chargerClient();
input.focus();
</script>
</body>
</html>
