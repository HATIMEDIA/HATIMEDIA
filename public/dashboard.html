<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATIMEDIA - Espace Médecin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f7f6; color: #333; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2563eb; font-size: 28px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .panel h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .card { background: #f9fafb; border-left: 4px solid #10b981; padding: 15px; margin-bottom: 10px; border-radius: 6px; }
        .card h3 { font-size: 15px; color: #1e293b; margin-bottom: 5px; }
        .card p { font-size: 13px; color: #64748b; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🩺 Espace Médecin - HATIMEDIA</h1>
        <p>Vos rendez-vous et bilans de pré-consultation</p>
    </div>
    
    <div class="container">
        <!-- Rendez-vous pris via l'annuaire -->
        <div class="panel">
            <h2>📅 Rendez-vous confirmés</h2>
            <div id="rdv-list"></div>
        </div>

        <!-- Bilans de pré-consultation -->
        <div class="panel">
            <h2>📋 Bilans de Pré-Consultation</h2>
            <div id="bilans-list"></div>
        </div>
    </div>

    <script>
        async function chargerRdv() {
            try {
                const res = await fetch('/api/rdv/liste');
                const data = await res.json();
                const container = document.getElementById('rdv-list');
                
                if (!data.ok || data.rdvs.length === 0) {
                    container.innerHTML = '<p style="color:#999;">Aucun rendez-vous pour le moment.</p>';
                    return;
                }

                data.rdvs.forEach(r => {
                    const date = new Date(r.appointment_date).toLocaleString("fr-FR");
                    container.innerHTML += `
                        <div class="card">
                            <h3>${r.patient_name} (${r.patient_email})</h3>
                            <p><strong>Avec :</strong> ${r.doctor_name} - ${r.doctor_specialty}</p>
                            <p><strong>Date :</strong> ${date}</p>
                            <p>📍 ${r.doctor_address}</p>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        async function chargerBilans() {
            try {
                const res = await fetch('/api/dashboard/pre-consultations');
                const data = await res.json();
                const container = document.getElementById('bilans-list');
                
                if (!data.ok || data.bilans.length === 0) {
                    container.innerHTML = '<p style="color:#999;">Aucun bilan pour le moment.</p>';
                    return;
                }

                data.bilans.forEach(b => {
                    const date = new Date(b.date).toLocaleString("fr-FR");
                    let texte = b.contenu.replace("📋 **Compte-rendu de pré-consultation**", "").trim();
                    container.innerHTML += `
                        <div class="card" style="border-left-color: #2563eb;">
                            <h3>Patient (Session: ${b.sessionId.substring(0,8)}...)</h3>
                            <p style="font-size:11px; margin-bottom:10px;">${date}</p>
                            <div style="white-space: pre-wrap; font-size:13px; line-height:1.5;">${texte}</div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        chargerRdv();
        chargerBilans();
    </script>
</body>
</html>
